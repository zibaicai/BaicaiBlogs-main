# 上游：前端 Next.js 进程
upstream baicai_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 上游：后端 Spring Boot 进程
upstream baicai_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name zibaicai.cn www.zibaicai.cn 8.153.164.215;

    # 上传限制 10MB（与后端 multipart 配置一致）
    client_max_body_size 10m;

    # ========== 后端 API 反代 ==========
    # 所有 /api/ 开头的请求转发到后端 8080
    location /api/ {
        proxy_pass         http://baicai_backend;
        proxy_http_version 1.1;

        # 转发真实客户端 IP（后端日志/限流会用）
        # proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 长连接
        proxy_set_header   Connection        "";

        # 超时（上传文件可能慢，给宽裕点）
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ========== Next.js 静态资源长缓存 ==========
    # _next/static/ 里是带 hash 的 JS/CSS，可永久缓存
    location /_next/static/ {
        proxy_pass         http://baicai_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            1y;
        add_header         Cache-Control "public, immutable";
    }

    # ========== 前端页面反代 ==========
    # 其他所有路径转发到前端 3000（Next.js 自己处理 SPA 路由）
    location / {
        proxy_pass         http://baicai_frontend;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ========== 安全头 ==========
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ========== 日志 ==========
    access_log  /var/log/nginx/baicai.access.log;
    error_log   /var/log/nginx/baicai.error.log  warn;
}
