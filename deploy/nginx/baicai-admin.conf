# 管理端（admin.zibaicai.cn）—— Vite 构建的纯静态 SPA
# 构建产物：apps/admin/dist/  →  服务器 /var/www/admin/

server {
    listen 80;
    listen [::]:80;
    server_name admin.zibaicai.cn;

    root /var/www/admin;
    index index.html;
    client_max_body_size 10m;

    # 后端 API
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 带 hash 的资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/editor/xxx、/settings 等由 React Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag           "noindex, nofollow" always;

    access_log /var/log/nginx/baicai-admin.access.log;
    error_log  /var/log/nginx/baicai-admin.error.log warn;
}
