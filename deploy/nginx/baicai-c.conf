# C 端（www.zibaicai.cn）—— 新公开站，只读
# 依赖：baicai-public.service 监听 127.0.0.1:3001，后端 127.0.0.1:8080

upstream baicai_public {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream baicai_c_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name zibaicai.cn www.zibaicai.cn 8.153.164.215;

    client_max_body_size 10m;

    # 旧站写入口：永久跳到新管理端
    location = /admin {
        return 301 https://admin.zibaicai.cn/;
    }
    location ^~ /admin/ {
        return 301 https://admin.zibaicai.cn/;
    }
    location = /editor {
        return 301 https://admin.zibaicai.cn/editor/new;
    }
    location ^~ /editor/ {
        return 301 https://admin.zibaicai.cn/editor/new;
    }

    # 后端 API
    location /api/ {
        proxy_pass         http://baicai_c_backend;
        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Next.js 带 hash 的静态资源
    location /_next/static/ {
        proxy_pass         http://baicai_public;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            1y;
        add_header         Cache-Control "public, immutable";
    }

    # 公开页面
    location / {
        proxy_pass         http://baicai_public;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/baicai-c.access.log;
    error_log  /var/log/nginx/baicai-c.error.log warn;
}
