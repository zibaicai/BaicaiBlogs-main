[DEFAULT]
bantime = 3600
findtime = 300
maxretry = 20
ignoreip = 127.0.0.1/8 ::1
backend = polling

[sshd]
enabled = true
backend = polling
logpath = /var/log/auth.log
maxretry = 5
bantime = 3600

[baicai-scan]
enabled = true
filter = baicai-scan
backend = polling
logpath = /var/log/nginx/baicai.access.log
          /var/log/nginx/access.log
maxretry = 25
findtime = 300
bantime = 3600
action = iptables-allports[name=baicai-scan]

[baicai-limit]
enabled = true
filter = baicai-limit
backend = polling
logpath = /var/log/nginx/baicai.access.log
          /var/log/nginx/access.log
maxretry = 15
findtime = 300
bantime = 1800
action = iptables-allports[name=baicai-limit]
