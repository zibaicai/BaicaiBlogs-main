<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firefly Field · Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8f1ff;
      --muted: #91a6c4;
      --line: rgba(180, 210, 245, 0.14);
      --accent: #9dffc0;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #04101f;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      z-index: 0;
      background:
        radial-gradient(circle at 82% 14%, rgba(75, 121, 201, 0.16), transparent 34%),
        radial-gradient(circle at 18% 88%, rgba(20, 82, 108, 0.2), transparent 38%),
        linear-gradient(145deg, #04101f 0%, #071b30 52%, #020a13 100%);
    }

    body::after {
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 34%, rgba(1, 6, 14, 0.62) 100%);
    }

    #firefly-canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .title {
      position: fixed;
      z-index: 3;
      top: 30px;
      left: 34px;
      pointer-events: none;
    }

    .title small {
      display: block;
      margin-bottom: 8px;
      color: #7aa8ff;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .title h1 {
      margin: 0;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 3vw, 36px);
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.03em;
    }

    .hud {
      position: fixed;
      z-index: 3;
      right: 32px;
      top: 30px;
      width: min(250px, calc(100vw - 48px));
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(5, 17, 31, 0.62);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
    }

    .hud-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .hud-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hud-value {
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .hud-note {
      margin: 12px 0 0;
      color: rgba(145, 166, 196, 0.72);
      font-size: 10px;
      line-height: 1.75;
    }

    .controls {
      position: fixed;
      z-index: 3;
      bottom: 28px;
      left: 50%;
      display: flex;
      gap: 8px;
      align-items: center;
      transform: translateX(-50%);
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(5, 17, 31, 0.68);
      backdrop-filter: blur(16px);
    }

    .controls button {
      border: 0;
      border-radius: 999px;
      padding: 9px 15px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: color 160ms ease, background 160ms ease;
    }

    .controls button:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.06);
    }

    .controls button.primary {
      color: #061326;
      background: #b8ffd1;
    }

    @media (max-width: 680px) {
      .title { top: 22px; left: 22px; }
      .title p { display: none; }
      .hud { top: 22px; right: 22px; width: 190px; padding: 12px; }
      .controls { bottom: 18px; }
    }
  </style>
</head>
<body>
  <header class="title">
    <small>Random field · lifecycle study</small>
    <h1>萤火虫场</h1>
    <p>随机分布 / 远近层次 / 每只独立完成三轮明暗生命周期</p>
  </header>

  <aside class="hud" aria-live="polite">
    <div class="hud-row">
      <span class="hud-label">Active</span>
      <span class="hud-value" id="active-count">0 / 0</span>
    </div>
    <div class="hud-row" style="margin-top: 8px">
      <span class="hud-label">Depth</span>
      <span class="hud-value" id="depth-count">近 0 · 远 0</span>
    </div>
    <div class="hud-row" style="margin-top: 8px">
      <span class="hud-label">Render</span>
      <span class="hud-value" id="fps">60 FPS</span>
    </div>
    <p class="hud-note">大的在近处，小的在远处；每只独立亮起、转暗，第三轮降到全暗后换位置重生。</p>
  </aside>

  <canvas id="firefly-canvas" aria-hidden="true"></canvas>

  <div class="controls" role="toolbar" aria-label="萤火虫场演示控制">
    <button id="replay" class="primary" type="button">重新生成</button>
    <button id="pause" type="button" aria-pressed="true">暂停</button>
  </div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("firefly-canvas");
      const ctx = canvas.getContext("2d", { alpha: true });
      const activeEl = document.getElementById("active-count");
      const depthEl = document.getElementById("depth-count");
      const fpsEl = document.getElementById("fps");
      const replayBtn = document.getElementById("replay");
      const pauseBtn = document.getElementById("pause");

      if (!ctx) return;

      const TAU = Math.PI * 2;

      const CONFIG = {
        count: 42,
        riseSeconds: 2.2,
        fallSeconds: 2.4,
        valley: 1 / 3,
        cycles: 3,
        respawn: true,
        hiddenMin: 1.2,
        hiddenMax: 3.8,
        motion: {
          scale: 2.646, // 上一版 3.78 × 0.7
          speedMin: 0.2,
          speedMax: 0.8,
          wanderMin: 0.04,
          wanderMax: 0.16,
          wanderSpeedMin: 0.08,
          wanderSpeedMax: 0.24,
        },
        depth: {
          minScale: 0.32, // 远处
          maxScale: 1.0, // 近处
          nearChance: 0.22,
        },
      };

      const phases = [
        { cycle: 1, kind: "rise", from: 0, to: 1, seconds: CONFIG.riseSeconds },
        { cycle: 1, kind: "fall", from: 1, to: CONFIG.valley, seconds: CONFIG.fallSeconds },
        { cycle: 2, kind: "rise", from: CONFIG.valley, to: 1, seconds: CONFIG.riseSeconds },
        { cycle: 2, kind: "fall", from: 1, to: CONFIG.valley, seconds: CONFIG.fallSeconds },
        { cycle: 3, kind: "rise", from: CONFIG.valley, to: 1, seconds: CONFIG.riseSeconds },
        { cycle: 3, kind: "final-fall", from: 1, to: 0, seconds: CONFIG.fallSeconds },
      ];

      const state = {
        width: 0,
        height: 0,
        dpr: 1,
        particles: [],
        running: true,
        lastTime: performance.now(),
        fpsFrames: 0,
        fpsTime: performance.now(),
        frameHandle: 0,
      };

      const sprites = {
        green: createSprite([
          [0, "rgba(244, 255, 239, 1)"],
          [0.04, "rgba(232, 255, 226, 0.96)"],
          [0.12, "rgba(181, 255, 194, 0.68)"],
          [0.28, "rgba(128, 242, 157, 0.28)"],
          [0.48, "rgba(80, 213, 127, 0.1)"],
          [0.68, "rgba(44, 173, 102, 0.028)"],
          [0.86, "rgba(24, 126, 83, 0.006)"],
          [1, "rgba(24, 126, 83, 0)"],
        ]),
        gold: createSprite([
          [0, "rgba(255, 253, 229, 1)"],
          [0.04, "rgba(255, 250, 211, 0.94)"],
          [0.12, "rgba(255, 229, 148, 0.62)"],
          [0.28, "rgba(246, 201, 96, 0.24)"],
          [0.48, "rgba(217, 162, 48, 0.08)"],
          [0.68, "rgba(161, 113, 22, 0.025)"],
          [1, "rgba(161, 113, 22, 0)"],
        ]),
      };

      function createSprite(stops) {
        const size = 192;
        const el = document.createElement("canvas");
        el.width = size;
        el.height = size;
        const c = el.getContext("2d");
        const half = size / 2;
        const gradient = c.createRadialGradient(half, half, 0, half, half, half);
        for (const [at, color] of stops) gradient.addColorStop(at, color);
        c.fillStyle = gradient;
        c.fillRect(0, 0, size, size);
        return el;
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomInt(min, max) {
        return Math.floor(randomBetween(min, max + 1));
      }

      function makeParticle(index) {
        const d = CONFIG.depth;
        const m = CONFIG.motion;
        const depth = Math.random() < d.nearChance ? randomBetween(0.72, 1) : randomBetween(d.minScale, 0.68);
        const phaseIndex = randomInt(0, 4);
        const phaseElapsed = Math.random() * phases[phaseIndex].seconds;

        return {
          id: index,
          x: Math.random() * state.width,
          y: Math.random() * state.height,
          depth,
          vx: randomBetween(-m.speedMin, m.speedMin) * (0.4 + depth),
          vy: randomBetween(-m.speedMin, m.speedMin) * (0.4 + depth),
          wander: randomBetween(m.wanderMin, m.wanderMax) * (0.4 + depth),
          wanderSpeed: randomBetween(m.wanderSpeedMin, m.wanderSpeedMax),
          phase: Math.random() * TAU,
          phaseIndex,
          phaseElapsed,
          intensity: 0,
          visible: true,
          respawnAt: 0,
          tint: Math.random() < 0.1 ? "gold" : "green",
          alpha: 0.22 + depth * 0.68,
          glowMax: 16 + depth * 40,
          glowMin: 8 + depth * 20,
          coreMax: 1.1 + depth * 2.2,
          coreMin: 0.7 + depth * 1.2,
        };
      }

      function rebuild() {
        state.particles = Array.from({ length: CONFIG.count }, (_, i) => makeParticle(i));
        updateCounters();
      }

      function resize() {
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = Math.round(state.width * state.dpr);
        canvas.height = Math.round(state.height * state.dpr);
        canvas.style.width = `${state.width}px`;
        canvas.style.height = `${state.height}px`;
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

        for (const p of state.particles) {
          p.x = Math.min(state.width, Math.max(0, p.x));
          p.y = Math.min(state.height, Math.max(0, p.y));
        }
      }

      function easeInOut(t) {
        const x = Math.max(0, Math.min(1, t));
        return x * x * (3 - 2 * x);
      }

      function intensityAt(phase, progress) {
        return phase.from + (phase.to - phase.from) * easeInOut(progress);
      }

      function hideParticle(p, now) {
        p.visible = false;
        p.intensity = 0;
        p.respawnAt = now + randomBetween(CONFIG.hiddenMin, CONFIG.hiddenMax) * 1000;
      }

      function resetParticle(p) {
        Object.assign(p, makeParticle(p.id));
      }

      function updateParticle(p, dt, now, elapsed) {
        if (!p.visible) {
          if (CONFIG.respawn && now >= p.respawnAt) resetParticle(p);
          return;
        }

        const m = CONFIG.motion;
        const speedScale = (0.3 + p.depth * 0.7) * m.scale;
        const drift = Math.sin(elapsed * p.wanderSpeed + p.phase) * p.wander;
        p.x += (p.vx + drift) * dt * 60 * speedScale;
        p.y += (p.vy + Math.cos(elapsed * p.wanderSpeed * 0.7 + p.phase) * p.wander * 0.65) * dt * 60 * speedScale;

        const margin = 40;
        if (p.x < -margin) p.x = state.width + margin;
        if (p.x > state.width + margin) p.x = -margin;
        if (p.y < -margin) p.y = state.height + margin;
        if (p.y > state.height + margin) p.y = -margin;

        p.phaseElapsed += dt;

        while (p.visible && p.phaseElapsed >= phases[p.phaseIndex].seconds) {
          const current = phases[p.phaseIndex];
          if (current.kind === "final-fall") {
            hideParticle(p, now);
            return;
          }
          p.phaseElapsed -= current.seconds;
          p.phaseIndex += 1;
          if (p.phaseIndex >= phases.length) {
            hideParticle(p, now);
            return;
          }
        }

        const phase = phases[p.phaseIndex];
        p.intensity = intensityAt(phase, phase.seconds ? p.phaseElapsed / phase.seconds : 1);
      }

      function drawParticle(p) {
        if (!p.visible) return;

        const intensity = p.intensity;
        const visibility = Math.min(1, intensity * 3);
        if (visibility <= 0.01) return;

        const glow = p.glowMin + (p.glowMax - p.glowMin) * intensity;
        const core = p.coreMin + (p.coreMax - p.coreMin) * intensity;
        const sprite = sprites[p.tint];

        ctx.globalAlpha = (0.14 + intensity * 0.86) * visibility * p.alpha;
        ctx.drawImage(sprite, p.x - glow / 2, p.y - glow / 2, glow, glow);

        ctx.globalAlpha = (0.1 + intensity * 0.9) * visibility * p.alpha;
        ctx.fillStyle = p.tint === "gold" ? "rgba(255, 251, 223, 0.98)" : "rgba(246, 255, 231, 0.98)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.6, core), 0, TAU);
        ctx.fill();
      }

      function updateCounters() {
        const active = state.particles.filter((p) => p.visible).length;
        const near = state.particles.filter((p) => p.visible && p.depth >= 0.68).length;
        activeEl.textContent = `${active} / ${state.particles.length}`;
        depthEl.textContent = `近 ${near} · 远 ${Math.max(0, active - near)}`;
      }

      function drawFrame(now) {
        const rawDelta = Math.min(48, now - state.lastTime);
        state.lastTime = now;
        const dt = rawDelta / 1000;
        const elapsed = now / 1000;

        ctx.clearRect(0, 0, state.width, state.height);
        ctx.globalCompositeOperation = "source-over";

        if (state.running) {
          for (const p of state.particles) updateParticle(p, dt, now, elapsed);
        }

        for (const p of state.particles) drawParticle(p);

        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";

        if (now - state.fpsTime > 500) {
          const fps = Math.round((state.fpsFrames * 1000) / (now - state.fpsTime));
          fpsEl.textContent = `${fps} FPS`;
          state.fpsFrames = 0;
          state.fpsTime = now;
          updateCounters();
        }
        state.fpsFrames += 1;

        state.frameHandle = requestAnimationFrame(drawFrame);
      }

      replayBtn.addEventListener("click", () => {
        rebuild();
        state.running = true;
        state.lastTime = performance.now();
        pauseBtn.textContent = "暂停";
        pauseBtn.setAttribute("aria-pressed", "true");
      });

      pauseBtn.addEventListener("click", () => {
        state.running = !state.running;
        state.lastTime = performance.now();
        pauseBtn.textContent = state.running ? "暂停" : "继续";
        pauseBtn.setAttribute("aria-pressed", String(state.running));
      });

      window.addEventListener("resize", resize);

      resize();
      rebuild();
      state.lastTime = performance.now();
      state.fpsTime = performance.now();
      state.frameHandle = requestAnimationFrame(drawFrame);
    })();
  </script>
</body>
</html>
