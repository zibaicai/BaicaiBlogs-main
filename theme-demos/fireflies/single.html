<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firefly Lifecycle · Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8f1ff;
      --muted: #91a6c4;
      --line: rgba(180, 210, 245, 0.14);
      --accent: #9dffc0;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #04101f;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      z-index: 0;
      background:
        radial-gradient(circle at 82% 14%, rgba(75, 121, 201, 0.16), transparent 34%),
        radial-gradient(circle at 18% 88%, rgba(20, 82, 108, 0.2), transparent 38%),
        linear-gradient(145deg, #04101f 0%, #071b30 52%, #020a13 100%);
    }

    body::after {
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 34%, rgba(1, 6, 14, 0.62) 100%);
    }

    #firefly-canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .title {
      position: fixed;
      z-index: 3;
      top: 30px;
      left: 34px;
      pointer-events: none;
    }

    .title small {
      display: block;
      margin-bottom: 8px;
      color: #7aa8ff;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .title h1 {
      margin: 0;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 3vw, 36px);
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
      letter-spacing: 0.03em;
    }

    .hud {
      position: fixed;
      z-index: 3;
      right: 32px;
      top: 30px;
      width: min(300px, calc(100vw - 48px));
      padding: 16px 17px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(5, 17, 31, 0.62);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
    }

    .hud-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .hud-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hud-value {
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .hud-cycle {
      margin-top: 1px;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .hud-phase {
      margin-top: 4px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .meter {
      position: relative;
      height: 4px;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(160, 200, 235, 0.13);
    }

    .meter > i {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #5d9fdd, #c3ffd3);
      transition: width 80ms linear;
    }

    .hud-note {
      margin: 12px 0 0;
      color: rgba(145, 166, 196, 0.7);
      font-size: 10px;
      line-height: 1.75;
    }

    .controls {
      position: fixed;
      z-index: 3;
      bottom: 28px;
      left: 50%;
      display: flex;
      gap: 8px;
      align-items: center;
      transform: translateX(-50%);
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(5, 17, 31, 0.68);
      backdrop-filter: blur(16px);
    }

    .controls button {
      border: 0;
      border-radius: 999px;
      padding: 9px 15px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: color 160ms ease, background 160ms ease;
    }

    .controls button:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.06);
    }

    .controls button.primary {
      color: #061326;
      background: #b8ffd1;
    }

    @media (max-width: 680px) {
      .title { top: 22px; left: 22px; }
      .title p { display: none; }
      .hud { top: 22px; right: 22px; width: 210px; padding: 13px; }
      .hud-cycle { font-size: 18px; }
      .controls { bottom: 18px; }
    }
  </style>
</head>
<body>
  <header class="title">
    <small>Single firefly · lifecycle study</small>
    <h1>一次萤火</h1>
    <p>缓慢亮起 / 缓慢转暗 / 谷值回亮 / 第三轮转暗后消失</p>
  </header>

  <aside class="hud" aria-live="polite">
    <div class="hud-row">
      <span class="hud-label">Cycle</span>
      <span class="hud-value" id="cycle-metadata">1 / 3</span>
    </div>
    <div class="hud-cycle" id="cycle-value">第一轮</div>
    <div class="hud-phase" id="phase-value">正在变亮</div>
    <div class="meter" aria-hidden="true"><i id="brightness-meter"></i></div>
    <div class="hud-row" style="margin-top: 7px">
      <span class="hud-label">Brightness</span>
      <span class="hud-value" id="brightness-value">0%</span>
    </div>
    <p class="hud-note" id="hud-note">从全暗缓慢亮到峰值，再缓慢降到峰值的 1/3；第三轮从峰值缓慢落到 0 后消失。</p>
  </aside>

  <canvas id="firefly-canvas" aria-hidden="true"></canvas>

  <div class="controls" role="toolbar" aria-label="萤火虫生命周期演示控制">
    <button id="replay" class="primary" type="button">重新生成</button>
    <button id="pause" type="button" aria-pressed="true">暂停</button>
  </div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("firefly-canvas");
      const ctx = canvas.getContext("2d", { alpha: true });
      const cycleMetadata = document.getElementById("cycle-metadata");
      const cycleValue = document.getElementById("cycle-value");
      const phaseValue = document.getElementById("phase-value");
      const brightnessValue = document.getElementById("brightness-value");
      const brightnessMeter = document.getElementById("brightness-meter");
      const replayBtn = document.getElementById("replay");
      const pauseBtn = document.getElementById("pause");

      if (!ctx) return;

      const TAU = Math.PI * 2;
      const CONFIG = {
        riseSeconds: 2.2, // 从当前亮度缓慢升到峰值
        fallSeconds: 2.4, // 从峰值缓慢降到谷值
        valley: 1 / 3, // 谷值亮度：峰值的 1/3
        cycles: 3, // 第三轮转暗后消失
        glowMax: 44, // 峰值光晕直径，接近站点现有萤火虫体量
        glowMin: 22, // 谷值光晕直径
        coreMax: 3.2, // 峰值中心亮点半径
        coreMin: 1.8, // 谷值中心亮点半径
        driftX: 46,
        driftY: 30,
      };

      const phases = [
        { cycle: 1, kind: "rise", label: "正在变亮", from: 0, to: 1, seconds: CONFIG.riseSeconds },
        { cycle: 1, kind: "fall", label: "正在转暗", from: 1, to: CONFIG.valley, seconds: CONFIG.fallSeconds },
        { cycle: 2, kind: "rise", label: "谷值回亮", from: CONFIG.valley, to: 1, seconds: CONFIG.riseSeconds },
        { cycle: 2, kind: "fall", label: "正在转暗", from: 1, to: CONFIG.valley, seconds: CONFIG.fallSeconds },
        { cycle: 3, kind: "rise", label: "最后一轮回亮", from: CONFIG.valley, to: 1, seconds: CONFIG.riseSeconds },
        { cycle: 3, kind: "final-fall", label: "最终转暗", from: 1, to: 0, seconds: CONFIG.fallSeconds },
      ];

      const state = {
        width: 0,
        height: 0,
        dpr: 1,
        phaseIndex: 0,
        phaseElapsed: 0,
        intensity: 0,
        startedAt: 0,
        running: true,
        ended: false,
        lastTime: performance.now(),
        frameHandle: 0,
      };

      const sprite = (() => {
        const size = 192;
        const el = document.createElement("canvas");
        el.width = size;
        el.height = size;
        const c = el.getContext("2d");
        const half = size / 2;
        const gradient = c.createRadialGradient(half, half, 0, half, half, half);
        gradient.addColorStop(0, "rgba(244, 255, 239, 1)");
        gradient.addColorStop(0.04, "rgba(232, 255, 226, 0.96)");
        gradient.addColorStop(0.12, "rgba(181, 255, 194, 0.68)");
        gradient.addColorStop(0.28, "rgba(128, 242, 157, 0.28)");
        gradient.addColorStop(0.48, "rgba(80, 213, 127, 0.1)");
        gradient.addColorStop(0.68, "rgba(44, 173, 102, 0.028)");
        gradient.addColorStop(0.86, "rgba(24, 126, 83, 0.006)");
        gradient.addColorStop(1, "rgba(24, 126, 83, 0)");
        c.fillStyle = gradient;
        c.fillRect(0, 0, size, size);
        return el;
      })();

      function resize() {
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = Math.round(state.width * state.dpr);
        canvas.height = Math.round(state.height * state.dpr);
        canvas.style.width = `${state.width}px`;
        canvas.style.height = `${state.height}px`;
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      function easeInOut(t) {
        const x = Math.max(0, Math.min(1, t));
        return x * x * (3 - 2 * x);
      }

      function reset() {
        state.phaseIndex = 0;
        state.phaseElapsed = 0;
        state.intensity = 0;
        state.startedAt = performance.now();
        state.ended = false;
        state.running = true;
        state.lastTime = performance.now();
        pauseBtn.textContent = "暂停";
        pauseBtn.setAttribute("aria-pressed", "true");
        updateHud(0);
      }

      function updateHud(intensity) {
        const phase = phases[state.phaseIndex];
        const cycle = Math.min(CONFIG.cycles, (phase?.cycle || 3));
        const percent = Math.round(intensity * 100);

        cycleMetadata.textContent = `${cycle} / ${CONFIG.cycles}`;
        cycleValue.textContent = `第${cycle}轮`;
        phaseValue.textContent = state.ended ? "已消失" : phase.label;
        brightnessValue.textContent = `${percent}%`;
        brightnessMeter.style.width = `${percent}%`;
        cycleValue.style.color = state.ended ? "#91a6c4" : "";
        phaseValue.style.color = state.ended ? "#91a6c4" : "";
      }

      function drawBackground() {
        ctx.clearRect(0, 0, state.width, state.height);
      }

      function drawFirefly(time) {
        if (state.ended) return;

        const centerX = state.width / 2;
        const centerY = state.height * 0.54;
        const x = centerX + Math.sin(time * 0.00022) * CONFIG.driftX;
        const y = centerY + Math.cos(time * 0.00017) * CONFIG.driftY;
        const intensity = state.intensity;
        const glow = CONFIG.glowMin + (CONFIG.glowMax - CONFIG.glowMin) * intensity;
        const core = CONFIG.coreMin + (CONFIG.coreMax - CONFIG.coreMin) * intensity;
        // Below the 1/3 valley, fade all the way to transparent instead of leaving a dim dot.
        const visibility = Math.min(1, intensity * 3);

        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = (0.2 + intensity * 0.8) * visibility;
        ctx.drawImage(sprite, x - glow / 2, y - glow / 2, glow, glow);

        ctx.globalAlpha = (0.15 + intensity * 0.85) * visibility;
        ctx.fillStyle = "rgba(246, 255, 231, 0.98)";
        ctx.beginPath();
        ctx.arc(x, y, core, 0, TAU);
        ctx.fill();

        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
      }

      function advance(dt) {
        if (state.ended || !state.running) return;

        const phase = phases[state.phaseIndex];
        state.phaseElapsed += dt;

        if (state.phaseElapsed >= phase.seconds) {
          state.phaseElapsed = phase.seconds;

          if (phase.kind === "final-fall") {
            // Third fall reaches 0, then the firefly disappears.
            state.intensity = 0;
            state.ended = true;
            state.running = false;
            pauseBtn.textContent = "重播";
            pauseBtn.setAttribute("aria-pressed", "false");
            updateHud(0);
            return;
          }

          state.phaseIndex += 1;
          state.phaseElapsed = 0;
        }

        const current = phases[state.phaseIndex];
        const progress = current.seconds ? state.phaseElapsed / current.seconds : 1;
        state.intensity = current.from + (current.to - current.from) * easeInOut(progress);
        updateHud(state.intensity);
      }

      function frame(now) {
        const rawDelta = Math.min(48, now - state.lastTime);
        state.lastTime = now;

        drawBackground();
        if (state.running) advance(rawDelta / 1000);
        drawFirefly(now);

        state.frameHandle = requestAnimationFrame(frame);
      }

      replayBtn.addEventListener("click", () => {
        reset();
      });

      pauseBtn.addEventListener("click", () => {
        if (state.ended) {
          reset();
          return;
        }
        state.running = !state.running;
        state.lastTime = performance.now();
        pauseBtn.textContent = state.running ? "暂停" : "继续";
        pauseBtn.setAttribute("aria-pressed", String(state.running));
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) state.lastTime = performance.now();
      });

      window.addEventListener("resize", resize);

      resize();
      reset();
      state.frameHandle = requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
