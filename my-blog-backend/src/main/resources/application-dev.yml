# 本地开发环境配置（默认激活）
# 数据库：本地 MySQL，密码 123456
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/blogs?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 本地开发允许的前端来源
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002

# 开发环境打印详细 SQL 日志，便于调试
logging:
  level:
    com.baicaiblogs: DEBUG
    org.hibernate.SQL: DEBUG
