server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blogs?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: baicaiblogs-jwt-secret-key-2026-super-long-string-for-security-production-key
  expiration: 86400000

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002

logging:
  level:
    com.baicaiblogs: DEBUG
    org.hibernate.SQL: DEBUG
